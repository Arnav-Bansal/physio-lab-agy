<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PhysioLab CRM — Staff &amp; Doctor App</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #141e1e;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(0, 133, 142, 0.25);
        border: 1px solid #2dd4bf;
        color: #5eead4;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.72);
        max-width: 320px;
        line-height: 1.5;
      }
      a {
        margin-top: 20px;
        display: inline-block;
        background: #00858e;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
    <script>
      window.location.replace('https://physio-lab-agy.vercel.app/crm');
    </script>
  </head>
  <body>
    <span class="badge">The Physio Lab • Barewal Awana</span>
    <h1>PhysioLab Staff &amp; Doctor CRM</h1>
    <p>Connecting to live multi-clinic schedule, SOAP charts, and WhatsApp care hub...</p>
    <a href="https://physio-lab-agy.vercel.app/crm">Launch CRM Cockpit</a>
  </body>
</html>
